[project]
name = "settlemark"
version = "2.0.0"
description = "Reproducible onchain settlement research: the NEAR settlement thesis."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.8", "pandas>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF003", "B905", "SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
