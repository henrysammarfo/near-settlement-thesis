# Settlemark configuration. Every tunable used by the pipeline lives here.
# Changing a value here and running `npm run rebuild` changes the outputs; nothing else is hidden in code.

[project]
name = "Settlemark"
tagline = "Onchain settlement research"
repo = "https://github.com/henrysammarfo/near-settlement-thesis"
live_url = "https://near-settlement-thesis.vercel.app/"
other_project = "https://github.com/henrysammarfo/pocket"

[paths]
data = "data"
cache = ".cache/http"
results = "results"
charts = "charts"
site = "site"
template = "templates/THESIS.md.tmpl"
site_template = "templates/site.html.tmpl"
thesis = "THESIS.md"
bigquery_csv = "data/bigquery/receipt_actions_daily.csv"

[http]
timeout_seconds = 60
retries = 4
backoff_seconds = 3.0
cache_ttl_hours = 6
user_agent = "settlemark/2.0 (+https://github.com/henrysammarfo/near-settlement-thesis)"
pause_between_coingecko_calls_seconds = 2.0

[analysis]
week_rule = "W-SUN"         # weeks end on Sunday, UTC
compare_weeks = 13          # one quarter, for share and active account comparisons
endpoint_weeks = 4          # first and last month, for level comparisons
year_days = 364             # trailing year window ends on the last date with Intents volume
bootstrap_resamples = 2000
bootstrap_seed = 7
ci_level = 0.90
lag_weeks = 1

[falsifiers]
price_corr_max = 0.5        # F1: weekly change correlation with NEAR price above this
lag_corr_max = 0.3          # F3: price leading Intents above this
btc_corr_max = 0.5          # F4: weekly change correlation with Bitcoin above this
mcap_to_revenue_min = 50    # F5: market cap below this multiple of yearly Intents revenue

[sources]
intents_volume = "https://api.llama.fi/summary/dexs/near-intents?dataType=dailyVolume"
intents_fees = "https://api.llama.fi/summary/fees/near-intents?dataType=dailyFees"
intents_revenue = "https://api.llama.fi/summary/fees/near-intents?dataType=dailyRevenue"
all_dex_volume = "https://api.llama.fi/overview/dexs?excludeTotalDataChartBreakdown=true&excludeTotalDataChart=false"
near_stablecoins = "https://stablecoins.llama.fi/stablecoincharts/Near"
near_tvl = "https://api.llama.fi/v2/historicalChainTvl/Near"
near_chain = "https://api.nearblocks.io/v1/charts"
near_price = "https://api.coingecko.com/api/v3/coins/near/market_chart?vs_currency=usd&days=365&interval=daily"
btc_price = "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily"

[chain]
# Raw chain reads, one block per week, straight from archival RPC (no indexer).
endpoints = ["https://archival-rpc.mainnet.fastnear.com", "https://archival-rpc.mainnet.near.org"]
buyback_account = "buybacks.multisignature.near"
intents_account = "intents.near"
first_week = "2024-12-09"

[valuation]
# Assumptions, stated once. Growth scenarios are not typed here: bull is the observed
# annualised Intents revenue growth (last 182 days against the 182 before), capped below;
# base is half of it; bear is zero growth.
discount_rate = 0.15        # base discount rate for a volatile, early crypto cash flow
discount_low = 0.10
discount_high = 0.20
terminal_growth = 0.03      # long run growth after the fade, about nominal world GDP
explicit_years = 5          # years at the scenario growth rate
fade_years = 5              # years over which growth fades to terminal_growth
bull_growth_cap = 1.0       # never assume more than 100% a year, whatever the data says

[robustness]
rolling_weeks = 26          # the "any 26 week window" test in THESIS.md

[leadlag]
# Does Intents volume lead base chain usage? Weekly log changes, the same weeks as part 1.
max_lag = 4                 # cross correlations for leads and lags of up to this many weeks
lags = [1, 2, 3, 4]         # Granger style F tests run at each of these lag orders
main_lags = 2               # the one we headline, fixed before looking (two weeks)
min_shift = 8               # circular shift null: rotate the leader by at least this many weeks
alpha = 0.05                # a lead counts only if both p values are below this

[peers]
# Cross chain routers with daily volume, fees and revenue on DefiLlama's free API, compared
# over the same days. market_cap is CoinGecko, only for routers that have their own token.
window_days = 91
coingecko_pause_seconds = 2.0

[[peers.protocol]]
slug = "near_intents"
name = "NEAR Intents"
model = "intents, solver auctions"
main = true                 # read from data/intents_*.csv, the files the rest of the thesis uses

[[peers.protocol]]
slug = "thorchain"
name = "THORChain"
model = "native asset pools"
volume = "https://api.llama.fi/summary/dexs/thorchain-dex?dataType=dailyVolume"
fees = "https://api.llama.fi/summary/fees/thorchain-dex?dataType=dailyFees"
revenue = "https://api.llama.fi/summary/fees/thorchain-dex?dataType=dailyRevenue"
market_cap = "https://api.coingecko.com/api/v3/coins/thorchain/market_chart?vs_currency=usd&days=365&interval=daily"

[[peers.protocol]]
slug = "chainflip"
name = "Chainflip"
model = "native asset pools, JIT market makers"
volume = "https://api.llama.fi/summary/dexs/chainflip?dataType=dailyVolume"
fees = "https://api.llama.fi/summary/fees/chainflip?dataType=dailyFees"
revenue = "https://api.llama.fi/summary/fees/chainflip?dataType=dailyRevenue"
market_cap = "https://api.coingecko.com/api/v3/coins/chainflip/market_chart?vs_currency=usd&days=365&interval=daily"

[[peers.protocol]]
slug = "lifi"
name = "LI.FI"
model = "aggregator over other bridges"
volume = "https://api.llama.fi/summary/bridge-aggregators/li.fi?dataType=dailyBridgeVolume"
fees = "https://api.llama.fi/summary/fees/li.fi?dataType=dailyFees"
revenue = "https://api.llama.fi/summary/fees/li.fi?dataType=dailyRevenue"

[[peers.protocol]]
slug = "rango"
name = "Rango"
model = "aggregator over other bridges"
volume = "https://api.llama.fi/summary/bridge-aggregators/rango?dataType=dailyBridgeVolume"
fees = "https://api.llama.fi/summary/fees/rango?dataType=dailyFees"
revenue = "https://api.llama.fi/summary/fees/rango?dataType=dailyRevenue"

[bigquery]
# The NEAR BigQuery public dataset is a main source. Its results are committed in data/bigquery/
# with a manifest (scan size, run time, a hash of the SQL), so a fresh clone with no Google account
# rebuilds byte for byte. `npm run bigquery` reruns every query: dry run first, and it refuses any
# query above max_gb so the free 1 TB a month is never exceeded by accident.
dataset = "bigquery-public-data.crypto_near_mainnet_us"
max_gb = 400

[[bigquery.query]]
key = "01"
csv = "receipt_actions_daily.csv"
columns = ["day:date", "receipt_actions:int", "note:optional"]
required = true

[[bigquery.query]]
key = "04"
csv = "04_intents_weekly.csv"
columns = ["week_start:date", "intents_receipts:int", "senders:int"]
required = false            # becomes true once its first committed run lands

[[bigquery.query]]
key = "05"
csv = "05_weekly_activity.csv"
columns = ["week_start:date", "transactions:int", "signers:int"]
required = false            # becomes true once its first committed run lands
